[package]
name = "open-harness-manage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "open-harness-manage: control plane API"

[[bin]]
name = "open-harness-manage"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true }
reqwest = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
bytes = "1"
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
config-runtime = { path = "../../crates/config-runtime" }
governance-plane = { path = "../../crates/governance-plane" }
unified-config = { path = "../../crates/unified-config" }
channel-bootstrap = { path = "../../crates/channel-bootstrap" }
protocol-compat = { path = "../../crates/protocol-compat" }
app-auth = { path = "../../crates/app-auth" }
state-abstraction = { path = "../../crates/state-abstraction" }
storage-registry = { path = "../../crates/storage-registry" }
runtime-kernel = { path = "../../crates/runtime-kernel" }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
tempfile = "3"
