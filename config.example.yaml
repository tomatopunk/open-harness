storage:
  mode: local_fs
  local_fs_root: .deer-flow/local-fs
  sqlite_url: null
  postgres_url: null
  redis_url: redis://127.0.0.1:6379
  s3_bucket: null
  s3_prefix: open-harness

models:
  - name: gpt-4
    display_name: GPT-4
    use: langchain_openai:ChatOpenAI
    model: gpt-4
    api_key: $OPENAI_API_KEY
    max_tokens: 4096
    temperature: 0.7

  - name: openrouter-gemini-2.5-flash
    display_name: Gemini 2.5 Flash (OpenRouter)
    use: langchain_openai:ChatOpenAI
    model: google/gemini-2.5-flash-preview
    api_key: $OPENAI_API_KEY
    base_url: https://openrouter.ai/api/v1

  - name: gpt-5-responses
    display_name: GPT-5 (Responses API)
    use: langchain_openai:ChatOpenAI
    model: gpt-5
    api_key: $OPENAI_API_KEY
    use_responses_api: true
    output_version: responses/v1

gateway:
  bind: 0.0.0.0:8080
  langgraph_upstream: http://127.0.0.1:2024
  # Optional OTLP endpoint, e.g. http://127.0.0.1:4317
  # export OPEN_HARNESS_OTLP_ENDPOINT=http://127.0.0.1:4317
  auth:
    enabled: false
    api_keys: []
    bearer_tokens: []

manage:
  bind: 0.0.0.0:8081
  langgraph_url: http://127.0.0.1:2024
  # Local thread workspace dirs only (deer-flow layout compatibility). NOT a second storage contract:
  # durable state uses storage.mode + StorageRegistry. See README and docs/ops-storage-modes.md.
  threads_root: .deer-flow/threads
  auth:
    enabled: false
    api_keys: []
    bearer_tokens: []
  webhook_secret: null

channels:
  enabled:
    - dingtalk
    - wecom
  # Optional outbound webhook env vars:
  # DINGTALK_WEBHOOK_URL=https://oapi.dingtalk.com/robot/send?access_token=...
  # WECOM_WEBHOOK_URL=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=...

runtime:
  engine: inner
  governance_root: governance
