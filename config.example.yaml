# Open Harness Configuration
# 完整配置示例，包含所有可配置组件

log_level: debug

# Storage 配置
storage:
  mode: local_fs
  local_fs:
    root: .deer-flow/local-fs
  sqlite:
    url: null
  postgres:
    url: null
  redis:
    url: redis://127.0.0.1:6379
    password: null
  s3:
    bucket: null
    prefix: open-harness
    region: null
    endpoint: null

# Agent Loop 配置
agent_loop:
  enabled: true
  max_iterations: 100
  completion_promise: "DONE"
  debounce_seconds: 30

# Memory 系统配置
memory:
  enabled: true
  storage_path: memory/memory.json
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000

# Channels 配置
channels:
  enabled:
    - dingtalk
    - wecom
  bind: 0.0.0.0:8082
  dingtalk:
    enabled: true
    webhook_url: $DINGTALK_WEBHOOK_URL
    app_secret: $DINGTALK_APP_SECRET
  wecom:
    enabled: false
    webhook_url: $WECOM_WEBHOOK_URL

# Extensions 配置路径（MCP servers and skills）
extensions_config_path: ./extensions_config.json

# Models 配置
models:
  - name: gpt-4
    display_name: GPT-4
    use: langchain_openai:ChatOpenAI
    model: gpt-4
    api_key: $OPENAI_API_KEY
    max_tokens: 4096
    temperature: 0.7

  - name: openrouter-gemini-2.5-flash
    display_name: Gemini 2.5 Flash (OpenRouter)
    use: langchain_openai:ChatOpenAI
    model: google/gemini-2.5-flash-preview
    api_key: $OPENAI_API_KEY
    base_url: https://openrouter.ai/api/v1

  - name: gpt-5-responses
    display_name: GPT-5 (Responses API)
    use: langchain_openai:ChatOpenAI
    model: gpt-5
    api_key: $OPENAI_API_KEY
    use_responses_api: true
    output_version: responses/v1

# Gateway 配置
gateway:
  bind: 0.0.0.0:8080
  langgraph_upstream: http://127.0.0.1:2024
  # Optional OTLP endpoint, e.g. http://127.0.0.1:4317
  # export OPEN_HARNESS_OTLP_ENDPOINT=http://127.0.0.1:4317
  auth:
    enabled: false
    api_keys: []
    bearer_tokens: []

# Manage 配置
manage:
  bind: 0.0.0.0:8081
  langgraph_url: http://127.0.0.1:2024
  # Deprecated for durable I/O (ignored by manage for uploads/artifacts/lifecycle). Kept for YAML compat.
  # See docs/ops-storage-modes.md.
  threads_root: .deer-flow/threads
  auth:
    enabled: false
    api_keys: []
    bearer_tokens: []
  webhook_secret: null

# Runtime 配置
runtime:
  engine: inner
  governance_root: governance
