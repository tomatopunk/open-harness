[workspace]
resolver = "2"
members = [
    "crates/protocol-compat",
    "crates/config-runtime",
    "crates/state-abstraction",
    "crates/storage-sqlite",
    "crates/storage-postgres",
    "crates/storage-redis",
    "crates/storage-s3",
    "crates/orchestrator-core",
    "crates/tool-runtime",
    "crates/model-runtime",
    "crates/channel-runtime",
    "crates/channel-bootstrap",
    "crates/app-auth",
    "crates/channel-dingtalk",
    "crates/channel-wecom",
    "crates/sandbox-runtime",
    "apps/gateway",
    "apps/manage",
    "apps/channel",
    "apps/orchestrator",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "uuid", "chrono"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
object_store = { version = "0.11", features = ["aws"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"
futures = "0.3"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
jsonschema = "0.26"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
parking_lot = "0.12"
dashmap = "6"
tokio-util = "0.7"
backoff = { version = "0.4", features = ["tokio"] }
governor = "0.6"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
opentelemetry = "0.27"
opentelemetry-otlp = "0.27"
tracing-opentelemetry = "0.28"
async-openai = "0.27"
bollard = "0.18"
kube = { version = "0.98", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.24", features = ["v1_31"] }
tempfile = "3"
insta = { version = "1", features = ["json"] }
wiremock = "0.6"
rstest = "0.23"
notify = "7"
once_cell = "1"
figment = { version = "0.10", features = ["yaml", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
