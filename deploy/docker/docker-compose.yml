services:
  open-harness-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      OPEN_HARNESS_GATEWAY__LANGGRAPH_UPSTREAM: http://host.docker.internal:2024

  open-harness-manage:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.manage
    ports:
      - "8081:8081"
    environment:
      OPEN_HARNESS_MANAGE__LANGGRAPH_URL: http://host.docker.internal:2024
      OPEN_HARNESS_MANAGE__THREADS_ROOT: /data/threads
    volumes:
      - manage-data:/data

  open-harness-channel:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.channel
    ports:
      - "8082:8082"

  open-harness-orchestrator:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.orchestrator
    ports:
      - "8083:8083"

volumes:
  manage-data:
