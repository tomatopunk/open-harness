[package]
name = "package-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Package manager integration for Open Harness ecosystem"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
