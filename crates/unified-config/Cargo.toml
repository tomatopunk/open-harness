[package]
name = "unified-config"
version = "0.1.0"
edition = "2021"
description = "Unified configuration model for open-harness (models, tools, subagents, policies)"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["sync"] }

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }
